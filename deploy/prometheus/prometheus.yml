# Конфигурация Prometheus. Подаётся в контейнер как docker config.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Приложение: Swarm DNS `tasks.api` отдаёт A-записи ВСЕХ реплик сервиса api,
  # поэтому Prometheus скрейпит /metrics с каждой реплики.
  - job_name: api
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['tasks.api']
        type: A
        port: 3000

  # Метрики Traefik (включаются флагами --metrics.prometheus в стеке).
  - job_name: traefik
    static_configs:
      - targets: ['traefik:8082']

  # Метрики контейнеров (cAdvisor) и узла (node-exporter) — глобальные агенты.
  - job_name: cadvisor
    dns_sd_configs:
      - names: ['tasks.cadvisor']
        type: A
        port: 8080

  - job_name: node-exporter
    dns_sd_configs:
      - names: ['tasks.node-exporter']
        type: A
        port: 9100
