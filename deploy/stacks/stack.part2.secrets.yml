# Часть 2 — ПРАВИЛЬНЫЙ вариант (step-09): пароль БД через docker secret,
# несекретная конфигурация (APP_VERSION) через docker config. Пароля в открытом
# виде в этом файле нет.
#
# Подготовка:
#   bash deploy/traefik/certs/generate-cert.sh
#   cp deploy/secrets/db_password.txt.example deploy/secrets/db_password.txt   # впиши пароль
# Деплой:
#   docker stack deploy --resolve-image=never -c deploy/stacks/stack.part2.secrets.yml part2
version: '3.9'

services:
  api:
    image: swarm-demo-api:dev
    networks:
      - appnet
    environment:
      PORT: '3000'
      REDIS_URL: 'redis://redis:6379'
      # Несекретные параметры БД — обычным окружением.
      DB_HOST: 'postgres'
      DB_PORT: '5432'
      DB_USER: 'app'
      DB_NAME: 'appdb'
      # Пароль НЕ здесь — путь к файлу-секрету. Содержимое приложение читает само.
      DB_PASSWORD_FILE: '/run/secrets/db_password'
      # APP_VERSION приходит из docker config (см. configs ниже), не из env.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    configs:
      # Несекретная конфигурация: монтируется как /app/.env, configify её подхватит.
      - source: app_env
        target: /app/.env
    secrets:
      - source: db_password
        target: db_password # -> /run/secrets/db_password
    deploy:
      replicas: 3
      resources:
        limits: { cpus: '0.50', memory: 256M }
        reservations: { cpus: '0.10', memory: 64M }
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.api.rule=Host(`localhost`)
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls=true
        - traefik.http.services.api.loadbalancer.server.port=3000

  redis:
    image: redis:7-alpine
    networks:
      - appnet
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:16-alpine
    networks:
      - appnet
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: appdb
      # Пароль Postgres тоже из секрета (официальный образ поддерживает *_FILE).
      POSTGRES_PASSWORD_FILE: '/run/secrets/db_password'
    secrets:
      - source: db_password
        target: db_password
    volumes:
      - pg-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  traefik:
    # v3.6.x: swarm-провайдер корректно договаривается о версии Docker API
    # (нужно для Docker 28+, где минимальный API 1.40). В v3.1 и в v3.7.x —
    # баг "client version 1.24 is too old": провайдер не видит сервисы Swarm.
    image: traefik:v3.6.20
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=part2_appnet
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - { target: 80, published: 80, mode: ingress }
      - { target: 443, published: 443, mode: ingress }
      - { target: 8080, published: 8080, mode: ingress }
    networks:
      - appnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic/tls.yml
      - source: traefik_cert
        target: /certs/local.crt
    secrets:
      - source: traefik_key
        target: /certs/local.key
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  appnet:
    driver: overlay

volumes:
  redis-data:
  pg-data:

configs:
  app_env:
    file: ../configs/app.env
  traefik_dynamic:
    file: ../traefik/dynamic/tls.yml
  traefik_cert:
    file: ../traefik/certs/local.crt

secrets:
  db_password:
    file: ../secrets/db_password.txt
  traefik_key:
    file: ../traefik/certs/local.key
