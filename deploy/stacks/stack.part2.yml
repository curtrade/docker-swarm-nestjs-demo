# Часть 2 — стек Swarm. = Часть 1 + Postgres.
# Состояние step-08: пароль БД передаётся в открытом виде через окружение.
# ЭТО АНТИ-ПАТТЕРН — он исправляется в главе 09 (docker secret). Файл step-09
# (stack.part2.secrets.yml) показывает правильный вариант.
#
# Перед деплоем: bash deploy/traefik/certs/generate-cert.sh
# Деплой: docker stack deploy --resolve-image=never -c deploy/stacks/stack.part2.yml part2
version: '3.9'

services:
  api:
    image: swarm-demo-api:dev
    networks:
      - appnet
    environment:
      PORT: '3000'
      APP_VERSION: '2.0.0'
      REDIS_URL: 'redis://redis:6379'
      # ⚠️ АНТИ-ПАТТЕРН: пароль БД в открытом виде в окружении.
      # Виден в `service inspect`, в логах, в этом файле под git. Чиним в главе 09.
      DATABASE_URL: 'postgresql://app:app_password@postgres:5432/appdb?schema=public'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 3
      resources:
        limits: { cpus: '0.50', memory: 256M }
        reservations: { cpus: '0.10', memory: 64M }
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
        monitor: 15s
      rollback_config:
        parallelism: 1
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.http.routers.api.rule=Host(`localhost`)
        - traefik.http.routers.api.entrypoints=websecure
        - traefik.http.routers.api.tls=true
        - traefik.http.services.api.loadbalancer.server.port=3000

  redis:
    image: redis:7-alpine
    networks:
      - appnet
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:16-alpine
    networks:
      - appnet
    environment:
      POSTGRES_USER: app
      # ⚠️ АНТИ-ПАТТЕРН: пароль в открытом виде (см. главу 09).
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: appdb
    volumes:
      - pg-data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  traefik:
    # v3.6.x: swarm-провайдер корректно договаривается о версии Docker API
    # (нужно для Docker 28+, где минимальный API 1.40). В v3.1 и в v3.7.x —
    # баг "client version 1.24 is too old": провайдер не видит сервисы Swarm.
    image: traefik:v3.6.20
    command:
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=part2_appnet
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - { target: 80, published: 80, mode: ingress }
      - { target: 443, published: 443, mode: ingress }
      - { target: 8080, published: 8080, mode: ingress }
    networks:
      - appnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic/tls.yml
      - source: traefik_cert
        target: /certs/local.crt
    secrets:
      - source: traefik_key
        target: /certs/local.key
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  appnet:
    driver: overlay

volumes:
  redis-data:
  pg-data:

configs:
  traefik_dynamic:
    file: ../traefik/dynamic/tls.yml
  traefik_cert:
    file: ../traefik/certs/local.crt

secrets:
  traefik_key:
    file: ../traefik/certs/local.key
